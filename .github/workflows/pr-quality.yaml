name: PR Quality


## Caller of this workflow should use it as follows:
## jobs:
##   anti-slop:
##     permissions:
##       contents: read
##       issues: read
##       pull-requests: write
##     if: ${{ github.event.action == 'opened' || github.event.action == 'reopened' }}
##     uses: flutter-form-builder-ecosystem/.github/.github/workflows/pr-quality.yaml@main

on:
  workflow_call:

jobs:
  anti-slop:
    name: PR quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: peakoss/anti-slop@v0.3.0
        with:
          max-failures: 4
          close-pr: false
          lock-pr: false
          failure-add-pr-labels: agent-slop
          failure-pr-message: |
            This PR was flagged by our automated quality checks. If you're a genuine
            contributor, please reply here and a maintainer will review your PR.

            Common reasons for flagging:
            - New GitHub account
            - Unusually high number of repository forks in a 24-hour window

            We appreciate your contribution and apologize if this is a false positive!
